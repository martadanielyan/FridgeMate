<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7CB45">
<meta name="description" content="FridgeMate: рецепты из продуктов, которые уже есть дома.">
<title>FridgeMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FFF9E8; --surface:#FFFFFF; --surface2:#FFFCF2; --ink:#2A2311; --muted:#766A45; --dim:#A39870; --line:#F0E5C2; --line2:#E6D9AE;
  --sun:#F7CB45; --sun2:#EFBE2A; --sunInk:#2A2311; --soft:#FFF0BF; --softInk:#7A5A00;
  --fresh:#E2F3E4; --freshD:#2A7445; --warn:#FDE4D9; --warnD:#B4492A; --low:#E5EEF9; --lowD:#2F5C98; --plus:#EFE6FB; --plusD:#5E43A8;
  --shadow:0 1px 2px rgba(42,35,17,.04),0 8px 24px rgba(180,140,20,.10); --shadowLg:0 24px 60px rgba(42,35,17,.2);
  --display:"Montserrat Alternates","Golos Text",system-ui,sans-serif; --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--softInk);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface2);border-color:#D9C98F}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sunInk)}
.btn.primary:hover{background:var(--sun2);border-color:var(--sun2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.soft{background:var(--soft);border-color:transparent;color:var(--softInk)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.lg{padding:14px 20px;font-size:16px;border-radius:16px}
.btn.icon{width:40px;height:40px;padding:0}
.btn.block{width:100%}
.btn.danger{color:var(--warnD)} .btn.danger:hover{background:var(--warn);border-color:transparent}
.btn.plus{background:linear-gradient(135deg,#7B5BD6,#A98AF0);border-color:transparent;color:#fff}
.field{display:grid;gap:6px}
.field>span{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:13px;padding:11px 13px;font-size:16px;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--sun2);box-shadow:0 0 0 4px var(--soft)}
.inp.err{border-color:var(--warnD)}
.ferr{font-size:12.5px;color:var(--warnD)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:480px){.g2.st{grid-template-columns:1fr}}
@media (max-width:440px){.g3{grid-template-columns:1fr 1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--softInk);white-space:nowrap}
.chip.fresh{background:var(--fresh);color:var(--freshD)} .chip.warn{background:var(--warn);color:var(--warnD)} .chip.low{background:var(--low);color:var(--lowD)} .chip.plus{background:var(--plus);color:var(--plusD)} .chip.gray{background:#F3EEDD;color:var(--muted)}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;cursor:pointer}
.pick button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pick button.no{background:var(--warn);border-color:transparent;color:var(--warnD);text-decoration:line-through}

/* welcome */
.welcome{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(700px 420px at 100% 0,#FFE9A3 0,transparent 60%),radial-gradient(600px 420px at 0 100%,#FFF1C9 0,transparent 60%),var(--bg)}
.wcard{width:min(480px,100%);background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadowLg);display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:21px}
.brand .lg{width:40px;height:40px;border-radius:13px;background:var(--sun);color:var(--sunInk);display:grid;place-items:center}
.brand .lg svg{width:22px;height:22px}
.wcard h1{font-size:27px;line-height:1.14;text-wrap:balance}
.wcard p{margin:0;color:var(--muted)}
.ex{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px}
.ex .ings{display:flex;gap:6px;flex-wrap:wrap}

/* shell */
.shell{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:26px;padding:24px 16px 40px;min-height:100vh;align-items:start}
.rail{position:sticky;top:24px;display:grid;gap:4px}
.rail .brand{padding:4px 8px 14px}
.rail a{display:flex;gap:11px;align-items:center;padding:10px 13px;border-radius:14px;color:var(--muted);font-weight:700;text-decoration:none}
.rail a:hover{background:var(--surface)}
.rail a.on{background:var(--soft);color:var(--softInk)}
.rail a .b{margin-left:auto;font-size:11.5px;background:var(--warn);color:var(--warnD);border-radius:99px;padding:1px 8px}
.rail .lbl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:12px 13px 2px}
.main{min-width:0;max-width:740px;width:100%}
.bnav{display:none}
@media (max-width:900px){
  .shell{display:block;padding:14px 16px calc(98px + env(safe-area-inset-bottom,0px))}
  .rail{display:none} .main{max-width:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:7px 2px;border-radius:14px;text-decoration:none;position:relative}
  .bnav a.on{color:var(--softInk);background:var(--soft)}
  .bnav svg{width:21px;height:21px}
  .bnav .b{position:absolute;top:2px;right:18%;min-width:17px;height:17px;border-radius:99px;background:var(--warnD);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head .ey{font-size:12.5px;font-weight:800;color:var(--softInk);text-transform:uppercase;letter-spacing:.08em}
.head h1{font-size:clamp(24px,5vw,31px);line-height:1.14;margin-top:2px}
.head .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;min-width:0}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;gap:10px}
.sec h2{font-size:18px;display:flex;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--soft);font-size:14px;margin-bottom:14px}
.banner svg{color:var(--softInk);margin-top:2px}
.banner.demo{background:#F3EEDD;border:1px dashed var(--line2)}

/* eat me first */
.first{background:linear-gradient(135deg,#FFE9E0,#FFF3D6);border:1px solid #F6D3C4;border-radius:22px;padding:16px;margin-bottom:14px;display:grid;gap:12px}
.first h2{font-size:18px;display:flex;gap:8px;align-items:center;color:var(--warnD)}
.frow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.75);border-radius:16px;padding:10px 12px}
.frow b{display:block}
.frow span{font-size:13px;color:var(--muted)}
/* now */
.now{display:grid;gap:12px}
.now .q{display:grid;gap:6px}
.now .q>span{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* recipe cards */
.rgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:8px;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;align-content:start;min-width:0}
.rc:hover{transform:translateY(-2px);border-color:var(--sun2)}
.rc h3{font-size:16px;line-height:1.25;font-family:var(--font);font-weight:700}
.rc .meta{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.ready{display:grid;gap:4px}
.ready .top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700}
.bar{height:8px;border-radius:99px;background:#F3EEDD;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--sun2)}
.bar i.full{background:#4FAE6E}
.miss{font-size:13px;color:var(--warnD);font-weight:600}
.rc.lock{position:relative;overflow:hidden;cursor:pointer}
.rc.lock>*{filter:blur(4px);opacity:.5}
.rc.lock::after{content:"Plus";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--plusD)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--soft);color:var(--softInk)}

/* fridge list */
.items{display:grid}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .ic{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.it b{display:block;font-weight:700}
.it .s{font-size:13px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.it .q{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.it .q small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.it button.row{border:0;background:none;text-align:left;padding:0;cursor:pointer;min-width:0}
.addrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media (max-width:560px){.addrow{grid-template-columns:1fr 1fr}}
.addb{display:grid;gap:6px;justify-items:center;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 8px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow)}
.addb:hover{border-color:var(--sun2)}
.addb .ic{width:42px;height:42px;border-radius:14px;background:var(--soft);color:var(--softInk);display:grid;place-items:center}
.scan{position:relative;border-radius:18px;overflow:hidden;display:grid;place-items:center;background:#000;max-height:260px}
.scan img{display:block;max-width:100%;max-height:260px}
.scan .beam{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#F7CB45,transparent);box-shadow:0 0 18px #F7CB45;animation:beam 1.3s ease-in-out infinite}
@keyframes beam{0%{top:4%}50%{top:94%}100%{top:4%}}
.found{display:grid;gap:6px}
.found label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;font-weight:700}
.found input{width:19px;height:19px;accent-color:#D9A400}
.found span{font-size:12.5px;color:var(--muted);font-weight:600}

/* shopping */
.shop{display:grid}
.sh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.sh:last-child{border-bottom:0}
.sh input[type=checkbox]{appearance:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line2);display:grid;place-items:center;cursor:pointer;margin:0;background:var(--surface)}
.sh input[type=checkbox]:checked{background:#4FAE6E;border-color:#4FAE6E}
.sh input[type=checkbox]:checked::after{content:"";width:10px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.sh b{font-weight:700}
.sh .s{font-size:13px;color:var(--muted)}
.partner{background:linear-gradient(135deg,#2A2311,#4A3D18);color:#fff;border-radius:22px;padding:18px;display:grid;gap:10px;margin-bottom:14px}
.partner b{font-family:var(--display);font-size:18px}
.partner span{font-size:13.5px;opacity:.85}

/* plan */
.pday{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pday:last-child{border-bottom:0}
.pday .d{width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--softInk);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;text-align:center;line-height:1.1}
.locked{position:relative;overflow:hidden}
.locked .bl{filter:blur(5px);opacity:.5;pointer-events:none}
.locked .lk{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.locked .lk>div{display:grid;gap:8px;justify-items:center;max-width:320px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{border-radius:18px;padding:14px;background:var(--soft);min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:clamp(17px,5vw,24px);font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:12.5px;font-weight:700;color:var(--softInk)}
.kpi.g{background:var(--fresh)} .kpi.g span{color:var(--freshD)}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;font-size:14px}
.hb .t{height:10px;border-radius:99px;background:#F3EEDD;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:99px;background:var(--sun2)}
.hb .v{font-weight:700;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0;padding-bottom:0} .row:first-child{padding-top:0}
.row b{display:block} .row .d{font-size:13px;color:var(--muted)}
.more{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.more a{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);font-weight:700}
.more a span{font-size:13px;color:var(--muted);font-weight:500}
.more .ic{width:42px;height:42px;border-radius:14px;background:var(--soft);color:var(--softInk);display:grid;place-items:center}
.ava{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--softInk);display:grid;place-items:center;font-weight:800;flex:none}
.offer{border-radius:26px;padding:24px;background:linear-gradient(150deg,#6B4BC8,#A98AF0);color:#fff;display:grid;gap:12px;margin-bottom:14px;box-shadow:var(--shadowLg)}
.offer h2{font-size:24px;line-height:1.15}
.offer .pr{font-family:var(--display);font-size:38px;font-weight:800;line-height:1}
.offer .pr small{font-family:var(--font);font-size:15px;font-weight:600;opacity:.9}
.offer ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}

/* modal & toast */
.ov{position:fixed;inset:0;z-index:70;background:rgba(42,35,17,.42);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border-radius:26px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadowLg);animation:pu .2s ease}
@keyframes pu{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:21px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;line-height:1.2}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ing{display:grid;gap:6px}
.ing div{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:14.5px}
.ing .ok{color:var(--freshD)} .ing .no{color:var(--warnD)}
.ing small{color:var(--muted)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px}
@media (max-width:560px){.ov{place-items:end center;padding:0}.modal{border-radius:26px 26px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:11px 15px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:var(--shadowLg);animation:pu .2s}
.toast svg{color:#F7CB45}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="layers"></div>

<script>
(function(){
"use strict";
/* ================================================================
   FridgeMate — прототип в одном файле.
   catalog (продукты) · recipes (база рецептов) · matcher (подбор)
   scan (имитация AI Scan — точка подключения vision API)
   planner (меню по бюджету) · shopping · stats · ui / screens
   ================================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const D=s=>new Date(s+"T00:00:00");
const today=()=>iso(new Date());
const addDays=(s,n)=>{ const d=D(s); d.setDate(d.getDate()+n); return iso(d); };
const left=s=>Math.round((D(s)-D(today()))/864e5);
const MG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MP=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const dl=s=>{ const d=D(s); return `${d.getDate()} ${MG[d.getMonth()]}`; };
const nf=n=>Math.round(n).toLocaleString("ru-RU");
const rub=n=>nf(n)+" ₽";

const mem={};

  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} } };
async function hash(pw,salt){ try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pw)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ let h=5381; for(const c of salt+":"+pw) h=((h<<5)+h+c.charCodeAt(0))|0; return "f"+(h>>>0).toString(16); } }
const Auth={ users:()=>store.get("fm:users",[]), me(){ const id=store.get("fm:session",null); return id?this.users().find(u=>u.id===id)||null:null; },
  async register({name,email,password}){ const o={}; name=name.trim(); email=email.trim().toLowerCase(); if(name.length<2) o.name="Минимум 2 символа"; if(!/^\S+@\S+\.\S+$/.test(email)) o.email="Проверьте email"; if(password.length<6) o.password="Минимум 6 символов";
    if(!o.email&&this.users().some(u=>u.email===email)) o.email="Такой email уже зарегистрирован"; if(Object.keys(o).length) return {errors:o}; const salt=uid(); const u={id:uid(),name,email,salt,hash:await hash(password,salt)}; store.set("fm:users",[...this.users(),u]); store.set("fm:session",u.id); return {user:u}; },
  async login({email,password}){ email=email.trim().toLowerCase(); const u=this.users().find(x=>x.email===email); if(!u||u.demo||u.hash!==await hash(password,u.salt)) return {errors:{password:"Неверный email или пароль"}}; store.set("fm:session",u.id); return {user:u}; },

  logout(){ store.del("fm:session"); } };

/* ---------- fridge ---------- */
const have=id=>S.fridge.filter(f=>f.pid===id).reduce((a,f)=>a+f.qty,0);
function addItem(pid,qty,exp,by){ const ex=S.fridge.find(f=>f.pid===pid&&f.exp===exp); if(ex) ex.qty+=qty; else S.fridge.push({id:uid(),pid,qty,exp,by:by||ME.name,added:today()}); S.log.push({d:today(),t:"bought",pid,price:C[pid][4]}); }
function consume(pid,q,rescued){ let need=q; S.fridge.filter(f=>f.pid===pid).sort((a,b)=>a.exp.localeCompare(b.exp)).forEach(f=>{ if(need<=0) return; const take=Math.min(f.qty,need); f.qty-=take; need-=take; if(left(f.exp)<=2) rescued.add(pid); }); S.fridge=S.fridge.filter(f=>f.qty>0.001); }
const expiring=()=>S.fridge.filter(f=>left(f.exp)<=3).sort((a,b)=>a.exp.localeCompare(b.exp));
const expText=f=>{ const n=left(f.exp); return n<0?`просрочено ${-n} дн.`:n===0?"последний день":n===1?"до завтра":n<=30?`ещё ${n} ${plural(n,"день","дня","дней")}`:`до ${dl(f.exp)}`; };
const isLow=f=>have(f.pid)<=C[f.pid][6]&&C[f.pid][6]>0;

/* ---------- matcher ---------- */
const scale=()=>S.prefs.persons/2;
function match(r){ const sc=scale(); const st=([id,q])=>({id,q:q*sc,ok:have(id)>=q*sc*0.6}); const req=r.r.map(st), opt=r.o.map(st);
  const total=req.length+opt.length*0.375; const got=req.filter(x=>x.ok).length+opt.filter(x=>x.ok).length*0.375; const pct=Math.round(got/total*100);
  const missR=req.filter(x=>!x.ok), missO=opt.filter(x=>!x.ok); const exp=[...req,...opt].filter(x=>x.ok&&S.fridge.some(f=>f.pid===x.id&&left(f.exp)<=3)).map(x=>x.id);
  const cost=[...missR,...missO].reduce((a,x)=>a+C[x.id][4],0); return {r,pct,req,opt,missR,missO,exp,can:!missR.length,cost,costR:missR.reduce((a,x)=>a+C[x.id][4],0)}; }
function ranked(){ return R.filter(r=>!r.r.some(([id])=>S.prefs.dislike.includes(id))).map(match).sort((a,b)=>(b.can-a.can)||(b.exp.length-a.exp.length)||(b.pct-a.pct)||(a.r.t-b.r.t)); }

function cook(m){ const rescued=new Set(); const sc=scale(); [...m.r.r,...m.r.o].forEach(([id,q])=>{ if(have(id)>0) consume(id,q*sc,rescued); });
  [...m.req,...m.opt].filter(x=>x.ok).forEach(x=>S.log.push({d:today(),t:"used",pid:x.id,price:C[x.id][4],rescued:rescued.has(x.id)})); S.log.push({d:today(),t:"cooked",rid:m.r.id}); save(); return rescued.size; }

/* ---------- scan (имитация) ----------
   Точка подключения компьютерного зрения: вместо pickDetected() отправить фото на сервер
   POST /api/scan {image} → vision-модель → [{productId, quantity, confidence}] */
function pickDetected(file,kind){ const ids=Object.keys(C).filter(id=>have(id)===0); let h=file.size%9973; const out=[]; const n=kind==="receipt"?6:5; const pool=ids.slice();
  while(out.length<n&&pool.length){ h=(h*31+7)%9973; out.push(pool.splice(h%pool.length,1)[0]); } return out.map((id,i)=>({id,conf:97-((h+i*7)%14)})); }

/* ---------- planner (Plus) ---------- */
function buildPlan(days,budget){ const stock={}; S.fridge.forEach(f=>stock[f.pid]=(stock[f.pid]||0)+f.qty); const sc=scale(); const used=new Set(); const out=[]; let spent=0; const bought=new Set();
  const main=R.filter(r=>!r.tags.includes("завтрак")||r.tags.includes("сытное")).filter(r=>!r.r.some(([id])=>S.prefs.dislike.includes(id)));
  for(let d=0;d<days;d++){ let best=null;
    main.filter(r=>!used.has(r.id)).forEach(r=>{ const miss=r.r.filter(([id,q])=>(stock[id]||0)<q*sc*0.6&&!bought.has(id)).map(x=>x[0]); const cost=miss.reduce((a,id)=>a+C[id][4],0); if(spent+cost>budget) return;
      const exp=r.r.filter(([id])=>S.fridge.some(f=>f.pid===id&&left(f.exp)<=3+d)).length; const score=exp*3-miss.length*1.5-cost/200+(r.r.length-miss.length); if(!best||score>best.score) best={r,miss,cost,score}; });
    if(!best) break; used.add(best.r.id); spent+=best.cost; best.miss.forEach(id=>{ bought.add(id); stock[id]=(stock[id]||0)+C[id][2]; }); best.r.r.forEach(([id,q])=>stock[id]=Math.max(0,(stock[id]||0)-q*sc));
    out.push({date:addDays(today(),d),rid:best.r.id,miss:best.miss,cost:best.cost}); }
  return {days:out,spent,budget,asked:days,made:today()}; }

  return {usedPct:used.length+wasted.length?Math.round(used.length/(used.length+wasted.length)*100):null,saved:resc.length,economy:resc.reduce((a,x)=>a+x.price,0),wasted,bought,used,cooked:L.filter(x=>x.t==="cooked").length}; }

    <div class="card"><div class="row"><div><b>Бесплатная версия</b><span class="d">Распознавание продуктов (${FREE.scans} в день), ${FREE.recipes} лучших рецептов, ${FREE.now} подбора «Что приготовить сейчас» в день, список покупок, контроль сроков годности</span></div>${isPlus()?"":`<span class="chip">Сейчас</span>`}</div></div>`; },
  profile(){ const p=S.prefs; return head("Профиль",esc(ME.name))+`<div class="card"><div style="display:flex;gap:12px;align-items:center"><span class="ava" style="width:52px;height:52px;font-size:20px">${esc(ME.name[0].toUpperCase())}</span><div style="flex:1;min-width:0"><b style="font-size:18px;display:block">${esc(ME.name)}</b><span class="note">${ME.demo?"Демо-режим без регистрации":esc(ME.email)}</span></div><span class="chip ${isPlus()?"plus":"gray"}">${isPlus()?"Plus":"Бесплатно"}</span></div></div>
    <div class="card"><div class="sec" style="margin-top:0"><h2>Предпочтения</h2></div>${prefsForm(p)}<button class="btn primary" id="prefSave" style="margin-top:14px">Сохранить</button></div>
    <div class="card"><div class="row"><div><b>Пример данных</b><span class="d">Холодильник из описания: курица, помидоры, сыр, яйца, лаваш, йогурт</span></div><button class="btn" id="seed">Загрузить</button></div>
      <div class="row"><div><b>Очистить холодильник и списки</b><span class="d">Продукты, покупки и статистика</span></div><button class="btn danger" id="wipe">Очистить</button></div>
      <div class="row"><div><b>Выйти</b><span class="d">Данные останутся в этом браузере</span></div><button class="btn" id="logout">${ic("logout")}Выйти</button></div></div>`; }
};
const cap=s=>s[0].toUpperCase()+s.slice(1);
function prefsForm(p){ const ids=["chicken","mince","tuna","mushroom","cheese","milk","eggs","onion","garlic","pepper","banana","sausage"];
  return `<div style="display:grid;gap:14px"><div class="field"><span>Не ем (нажмите, чтобы исключить)</span><div class="pick" id="dis">${ids.map(id=>`<button type="button" data-v="${id}" class="${p.dislike.includes(id)?"no":""}">${C[id][7]} ${cn(id)}</button>`).join("")}</div></div>
    <div class="g3"><label class="field"><span>Ккал на блюдо, до</span><input class="inp" id="pk" type="number" min="200" max="1500" step="50" value="${p.kcal}" inputmode="numeric"></label><label class="field"><span>Бюджет в неделю, ₽</span><input class="inp" id="pb" type="number" min="0" step="100" value="${p.budget}" inputmode="numeric"></label><label class="field"><span>Человек</span><input class="inp" id="pp" type="number" min="1" max="8" value="${p.persons}" inputmode="numeric"></label></div></div>`; }
function bindPrefs(){ $$("#dis button").forEach(b=>b.onclick=()=>b.classList.toggle("no")); }
function readPrefs(){ const kcal=+$("#pk").value, budget=+$("#pb").value, persons=+$("#pp").value; if(!(kcal>=200&&kcal<=1500)){ toast("Калорийность: от 200 до 1500"); return false; } if(!(budget>=0)){ toast("Бюджет не может быть отрицательным"); return false; } if(!(persons>=1&&persons<=8)){ toast("Человек: от 1 до 8"); return false; }
  S.prefs={...S.prefs,dislike:$$("#dis button.no").map(b=>b.dataset.v),kcal,budget,persons:Math.round(persons)}; return true; }
function bindApp(){ const M=$(".main"); renderKeep=()=>{};
  $$("[data-rec]",M).forEach(b=>b.onclick=()=>recipeModal(b.dataset.rec)); $$("[data-lockrec]",M).forEach(b=>b.onclick=()=>paywall("В бесплатной версии показаны 6 лучших рецептов. В Plus — все."));
  $$("[data-pay]",M).forEach(b=>b.onclick=()=>paywall(b.dataset.pay));
  $$("[data-now]",M).forEach(g=>$$("button",g).forEach(b=>b.onclick=()=>{ const v=b.dataset.v; UI.now[g.dataset.now]=g.dataset.now==="mood"?v:+v; UI.nowRes=undefined; render(); }));
  const ng=$("#nowGo"); if(ng) ng.onclick=()=>{ const d=today(); const u=S.nowUse[d]||0; if(!isPlus()&&u>=FREE.now){ paywall(`В бесплатной версии ${FREE.now} подбора в день. В Plus — без ограничений.`); return; } S.nowUse={[d]:u+1}; save(); UI.nowRes=pickNow(UI.now); render(); };
  $$("[data-add]",M).forEach(b=>b.onclick=()=>b.dataset.add==="manual"?productForm():scanFlow(b.dataset.add)); $$("[data-item]",M).forEach(b=>b.onclick=()=>productForm(S.fridge.find(f=>f.id===b.dataset.item)));
  const fq=$("#fq"); if(fq){ let t; fq.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ UI.fq=fq.value; const p=fq.selectionStart; render(); const n=$("#fq"); if(n){ n.focus(); n.setSelectionRange(p,p); } },220); }; }
  $$("[data-rf]",M).forEach(b=>b.onclick=()=>{ UI.rfilter=b.dataset.rf; render(); });
  const sa=$("#shAdd"); if(sa) sa.onsubmit=e=>{ e.preventDefault(); const v=sa.name.value.trim(); if(v.length<2){ sa.name.focus(); return; } const pid=Object.keys(C).find(k=>C[k][0].toLowerCase()===v.toLowerCase())||""; S.shop.push({id:uid(),pid,name:pid?cn(pid):v,done:false,by:ME.name,src:""}); save(); toast("Добавлено в список"); render(); setTimeout(()=>{ const n=$("#shAdd input"); n&&n.focus(); },30); };
  $$("[data-buy]",M).forEach(c=>c.onchange=()=>{ const s=S.shop.find(x=>x.id===c.dataset.buy); s.done=c.checked; if(s.done&&s.pid){ addItem(s.pid,C[s.pid][2],addDays(today(),C[s.pid][3])); toast(`${s.name}: куплено и добавлено в холодильник`); } save(); setTimeout(render,200); });
  $$("[data-shdel]",M).forEach(b=>b.onclick=()=>{ S.shop=S.shop.filter(s=>s.id!==b.dataset.shdel); save(); render(); });
  const sb=$("#shBuy"); if(sb) sb.onclick=()=>{ const a=S.shop.filter(s=>!s.done&&C[s.pid]); partnerModal(a.map(s=>s.pid),a.reduce((x,s)=>x+C[s.pid][4],0)); };
  const sc=$("#shClear"); if(sc) sc.onclick=()=>{ S.shop=S.shop.filter(s=>!s.done); save(); render(); };
  $$("#pdays button",M).forEach(b=>b.onclick=()=>{ UI.pdays=+b.dataset.v; render(); });
  const pg=$("#planGo"); if(pg) pg.onclick=()=>{ const b=+$("#pbud").value; if(!(b>=0)){ toast("Введите бюджет"); return; } if(!S.fridge.length&&b<300){ toast("Холодильник пуст, а бюджета не хватит. Увеличьте бюджет"); return; } S.prefs.budget=b; S.plan=buildPlan(UI.pdays,b); save(); toast(S.plan.days.length?`Меню готово: ${S.plan.days.length} ${plural(S.plan.days.length,"день","дня","дней")}`:"Не получилось составить меню в этот бюджет"); render(); };
  const ps=$("#planShop"); if(ps) ps.onclick=()=>{ let n=0; S.plan.days.forEach(d=>n+=toShop(d.miss,recipe(d.rid).n)); toast(n?`В список покупок добавлено: ${n}`:"Всё уже в списке"); };
  $$("[data-sm]",M).forEach(b=>b.onclick=()=>{ UI.sMonth=b.dataset.sm; render(); });
  const ma=$("#mAdd"); if(ma) ma.onsubmit=e=>{ e.preventDefault(); const v=ma.name.value.trim(); if(v.length<2){ ma.name.focus(); return; } S.members.push({id:uid(),name:v,role:ma.role.value}); save(); toast(`${v} добавлен(а) в общий холодильник`); render(); };
  $$("[data-mdel]",M).forEach(b=>b.onclick=()=>{ S.members=S.members.filter(m=>m.id!==b.dataset.mdel); save(); render(); });
  const ls=$("#lowShop"); if(ls) ls.onclick=()=>{ const n=toShop([...new Set(S.fridge.filter(isLow).map(f=>f.pid))],""); toast(n?`В список покупок добавлено: ${n}`:"Уже в списке"); };
  const po=$("#plusOn"); if(po) po.onclick=()=>{ S.tier="plus"; save(); toast("FridgeMate Plus включён (тестовый режим)"); render(); }; const pf=$("#plusOff"); if(pf) pf.onclick=()=>{ S.tier="free"; save(); toast("Plus отключён"); render(); };
  if($("#dis")) bindPrefs(); const pv=$("#prefSave"); if(pv) pv.onclick=()=>{ if(readPrefs()){ save(); toast("Предпочтения сохранены"); render(); } };
  const sd=$("#seed"); if(sd) sd.onclick=async()=>{ if(!S.fridge.length||await confirmBox("Загрузить пример?","Текущий холодильник, покупки и статистика заменятся примером.","Загрузить")){ seedDemo(); toast("Пример загружен"); location.hash="home"; render(); } };
  const wp=$("#wipe"); if(wp) wp.onclick=async()=>{ if(await confirmBox("Очистить всё?","Продукты, список покупок, план и статистика удалятся.","Очистить")){ S.fridge=[]; S.shop=[]; S.log=[]; S.plan=null; save(); toast("Очищено"); render(); } };
  const lo=$("#logout"); if(lo) lo.onclick=()=>{ Auth.logout(); ME=null; S=null; UI.auth="start"; location.hash=""; render(); }; }

/* ---------- welcome & onboarding ---------- */
function Welcome(){ const a=UI.auth;
  if(a==="prefs") return `<div class="welcome"><div class="wcard"><div class="brand"><span class="lg">${ic("fridge")}</span>FridgeMate</div><div><h1>Расскажите о своём питании</h1><p style="margin-top:6px">Это можно изменить в профиле в любой момент.</p></div>${prefsForm(S.prefs)}<button class="btn primary lg block" id="obGo">Готово</button></div></div>`;
  if(a==="login"||a==="register") return `<div class="welcome"><form class="wcard" id="af" novalidate><div class="brand"><span class="lg">${ic("fridge")}</span>FridgeMate</div><div><h1>${a==="login"?"Вход":"Регистрация"}</h1><p style="margin-top:6px">${a==="login"?"Введите email и пароль.":"Аккаунт хранится в этом браузере."}</p></div>
    ${a==="register"?`<label class="field"><span>Имя</span><input class="inp" name="name" autocomplete="given-name" placeholder="Марта"><div class="ferr" data-err="name"></div></label>`:""}
    <label class="field"><span>Email</span><input class="inp" name="email" type="email" autocomplete="email" placeholder="you@mail.ru"><div class="ferr" data-err="email"></div></label>
    <label class="field"><span>Пароль</span><input class="inp" name="password" type="password" autocomplete="${a==="login"?"current-password":"new-password"}"><div class="ferr" data-err="password"></div></label>
    <button class="btn primary lg block">${a==="login"?"Войти":"Продолжить"}</button><button type="button" class="btn ghost block" id="aback">Назад</button></form></div>`;
  return `<div class="welcome"><div class="wcard"><div class="brand"><span class="lg">${ic("fridge")}</span>FridgeMate</div>
    <div><h1>Что приготовить из того, что уже есть дома?</h1><p style="margin-top:8px">Сфотографируйте холодильник. FridgeMate подберёт блюда, напомнит о сроках годности и соберёт список покупок.</p></div>
    <div class="ex"><div class="ings">${["chicken","tomato","cheese","eggs","lavash","yogurt"].map(id=>`<span class="chip">${C[id][7]} ${cn(id)}</span>`).join("")}</div><b>Кесадилья с курицей и сыром</b><div class="bar"><i style="width:90%"></i></div><span class="note">Готовность продуктов 90% · 20 минут · не хватает сладкого перца, можно и без него</span></div>
    <button class="btn primary lg block" id="wDemo">Посмотреть на примере</button><div class="g2"><button class="btn" id="wReg">Регистрация</button><button class="btn" id="wLog">Войти</button></div></div></div>`; }
function bindWelcome(){ const a=UI.auth;
  if(a==="start"){ $("#wDemo").onclick=()=>{ ME=Auth.demo(); load(); if(!S.onboarded){ S.onboarded=true; seedDemo(); } location.hash="home"; render(); toast("Открыт пример холодильника"); }; $("#wReg").onclick=()=>{ UI.auth="register"; render(); }; $("#wLog").onclick=()=>{ UI.auth="login"; render(); }; return; }
  if(a==="prefs"){ bindPrefs(); $("#obGo").onclick=()=>{ if(!readPrefs()) return; S.onboarded=true; save(); UI.auth="start"; location.hash="fridge"; render(); toast("Готово! Добавьте первые продукты"); }; return; }
  $("#aback").onclick=()=>{ UI.auth="start"; render(); }; $("#af").onsubmit=async e=>{ e.preventDefault(); const r=await Auth[a](fdata(e.target)); if(r.errors){ errs(e.target,r.errors); return; } ME=r.user; load(); UI.auth=S.onboarded?"start":"prefs"; if(S.onboarded) location.hash="home"; render(); }; setTimeout(()=>{ const f=$("#af input"); f&&f.focus(); },40); }

/* ---------- router ---------- */
window.addEventListener("hashchange",()=>{ UI.nowRes=undefined; render(); });
function render(){ $("#layers").innerHTML=""; ME=ME||Auth.me(); if(ME&&!S) load(); const app=$("#app");
  if(!ME||UI.auth==="prefs"||(S&&!S.onboarded)){ if(ME&&S&&!S.onboarded) UI.auth="prefs"; app.innerHTML=Welcome(); bindWelcome(); return; }
  let r=(location.hash||"#home").slice(1); if(!Screens[r]) r="home"; route=r; app.innerHTML=shell(Screens[r]()); bindApp(); }
render();
})();
</script>

</body>
